services:
  android:
    image: ${ROYD_IMAGE:-royd:dev}
    container_name: ${ROYD_CONTAINER:-royd}
    privileged: true
    ports:
      - "${ROYD_ADB_BIND:-127.0.0.1}:${ROYD_ADB_PORT:-5555}:5555"
    volumes:
      - royd-data:/data
    command:
      - androidboot.royd_width=${ROYD_WIDTH:-540}
      - androidboot.royd_height=${ROYD_HEIGHT:-960}
      - androidboot.royd_dpi=${ROYD_DPI:-240}
      - androidboot.royd_fps=${ROYD_FPS:-30}

volumes:
  royd-data:
    name: ${ROYD_DATA_VOLUME:-royd-data}
