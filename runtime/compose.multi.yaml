services:
  android-a:
    image: ${ROYD_IMAGE:-royd:dev}
    container_name: ${ROYD_CONTAINER_A:-royd-a}
    privileged: true
    ports:
      - "${ROYD_ADB_BIND:-127.0.0.1}:${ROYD_ADB_PORT_A:-5555}:5555"
    volumes:
      - royd-a-data:/data
  android-b:
    image: ${ROYD_IMAGE:-royd:dev}
    container_name: ${ROYD_CONTAINER_B:-royd-b}
    privileged: true
    ports:
      - "${ROYD_ADB_BIND:-127.0.0.1}:${ROYD_ADB_PORT_B:-5556}:5555"
    volumes:
      - royd-b-data:/data

volumes:
  royd-a-data:
    name: ${ROYD_DATA_VOLUME_A:-royd-a-data}
  royd-b-data:
    name: ${ROYD_DATA_VOLUME_B:-royd-b-data}
