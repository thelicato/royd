name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck gcc
      - name: Run repository CI
        run: make ci
      - name: Generate configured Android matrix
        run: make android-matrix-report ROYD_MATRIX_OUTPUT=android-matrix.md
      - name: Upload Android matrix
        uses: actions/upload-artifact@v4
        with:
          name: android-compatibility-matrix
          path: android-matrix.md
